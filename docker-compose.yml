services:
  propmap:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_INSFORGE_URL: ${NEXT_PUBLIC_INSFORGE_URL}
        NEXT_PUBLIC_INSFORGE_ANON_KEY: ${NEXT_PUBLIC_INSFORGE_ANON_KEY}
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "3000"
    networks:
      - dokploy-network
    labels:
      - "traefik.docker.network=dokploy-network"

networks:
  dokploy-network:
    external: true
